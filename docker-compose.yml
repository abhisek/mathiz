# Local development infrastructure for Mathiz.
#
#   make dev-db      → just PostgreSQL (run `mathiz serve` on the host)
#   make dev-up      → the WHOLE stack, self-contained:
#                      PostgreSQL + stub LLM + mathiz serve on :8080.
#                      No auth provider or LLM API key required — parent
#                      auth uses the `test` preset with a dev HS256 secret
#                      (mint tokens with
#                      .claude/skills/saas-e2e/assets/mint-jwt.mjs) and the
#                      kid flows only need a join code.
#
# To use a real LLM, set the MATHIZ_* env vars (or a .env file next to
# this compose file) — every default below is overridable.
#
#   docker compose --profile prod up -d
#                    → PRODUCTION on one VM: PostgreSQL + mathiz serve, no
#                      dev defaults. Every secret comes from .env. See
#                      docs/saas.md "Deploying on a VM".
services:
  postgres:
    # Dev only. `make dev-db` names this service, so it starts without the
    # profile flag; the profiles keep it out of `--profile prod`.
    profiles: ["dev", "full"]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mathiz
      POSTGRES_PASSWORD: mathiz
      POSTGRES_DB: mathiz
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images keep data in /var/lib/postgresql/<major>/docker,
      # so the volume mounts one level up. The volume name carries the major:
      # an old 16 volume must never be mounted into an 18 server.
      - mathiz-pg18data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathiz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # OpenAI-compatible stub: every question is "What is 12 + 7?" (answer 19),
  # with a canned micro-lesson. Perfect for flow development; swap for a real
  # provider via MATHIZ_OPENAI_BASE_URL / MATHIZ_LLM_PROVIDER.
  llmstub:
    profiles: ["full"]
    image: node:20-alpine
    environment:
      HOST: 0.0.0.0
    volumes:
      - ./.claude/skills/saas-e2e/assets/llmstub.mjs:/app/llmstub.mjs:ro
    command: ["node", "/app/llmstub.mjs"]

  mathiz:
    profiles: ["full"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      llmstub:
        condition: service_started
    environment:
      MATHIZ_DATABASE_URL: postgres://mathiz:mathiz@postgres:5432/mathiz?sslmode=disable
      # Parent auth: the `test` preset by default, so the stack needs no
      # auth provider. Mint tokens with mint-jwt.mjs (same default secret)
      # or paste one into /login. Set MATHIZ_AUTH_PROVIDER=supabase plus
      # MATHIZ_AUTH_URL and MATHIZ_AUTH_PUBLIC_KEY to use a real project.
      MATHIZ_AUTH_PROVIDER: ${MATHIZ_AUTH_PROVIDER:-test}
      MATHIZ_AUTH_URL: ${MATHIZ_AUTH_URL:-}
      MATHIZ_AUTH_PUBLIC_KEY: ${MATHIZ_AUTH_PUBLIC_KEY:-}
      MATHIZ_AUTH_ALLOW_TEST: ${MATHIZ_AUTH_ALLOW_TEST:-1}
      # Dev-only secret; never reuse it anywhere reachable from outside.
      MATHIZ_AUTH_HS256_SECRET: ${MATHIZ_AUTH_HS256_SECRET:-e2e-test-secret-with-plenty-of-length!!}
      MATHIZ_LLM_PROVIDER: ${MATHIZ_LLM_PROVIDER:-openai}
      MATHIZ_OPENAI_API_KEY: ${MATHIZ_OPENAI_API_KEY:-stub-key}
      MATHIZ_OPENAI_BASE_URL: ${MATHIZ_OPENAI_BASE_URL:-http://llmstub:9993/v1}
      MATHIZ_SERVER_ADDR: ":8080"
      # Monetisation with the fake provider: starter credits, plans, and
      # instant "checkout" — the full money loop, no real payments.
      MATHIZ_BILLING_PROVIDER: ${MATHIZ_BILLING_PROVIDER:-fake}
      MATHIZ_PUBLIC_BASE_URL: ${MATHIZ_PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"

  # ---- Production (one VM) ----
  # The database is reachable only on the private compose network: no
  # published port, so sslmode=disable in the app's DSN is safe. Back it up
  # every 12 hours from the host (docs/saas.md "Backups").
  prod-db:
    profiles: ["prod"]
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mathiz
      # Empty = the postgres image refuses to initialise, so a missing
      # MATHIZ_DB_PASSWORD in .env stops the stack instead of booting with
      # a guessable password. (A `:?` check would break every dev profile:
      # compose interpolates all services, active or not.)
      POSTGRES_PASSWORD: ${MATHIZ_DB_PASSWORD:-}
      POSTGRES_DB: mathiz
    volumes:
      - mathiz-prod-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathiz -d mathiz"]
      interval: 10s
      timeout: 5s
      retries: 10

  prod-app:
    profiles: ["prod"]
    build: .
    restart: unless-stopped
    depends_on:
      prod-db:
        condition: service_healthy
    # Auth, LLM, billing and analytics settings come from .env only: the
    # prod profile has no defaults, so a missing setting fails at boot.
    env_file: .env
    environment:
      MATHIZ_DATABASE_URL: postgres://mathiz:${MATHIZ_DB_PASSWORD:-}@prod-db:5432/mathiz?sslmode=disable
      MATHIZ_SERVER_ADDR: ":8080"
      # Wins over env_file: a .env copied from dev can never enable the
      # test auth preset, whose tokens anyone with the dev secret can mint.
      MATHIZ_AUTH_ALLOW_TEST: ""
    # Loopback only: a TLS reverse proxy on the host fronts the server.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mathiz-pg18data:
  mathiz-prod-pgdata:
